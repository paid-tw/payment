name: Publish Package

# Push tag v* → publish workspace packages whose name@version is not yet on npm.
# Uses npm OIDC trusted publishing (Trusted Publisher per package on npmjs.com).
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test

      # pnpm pack rewrites workspace:* → real versions; npm publish uses OIDC + provenance.
      - name: Publish packages
        run: |
          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue
            node -e "process.exit(require('./${dir}package.json').private ? 1 : 0)" || continue
            name=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${ver}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${ver} already published — skipping"
              continue
            fi
            echo "::group::publish ${name}@${ver}"
            ( cd "$dir" && pnpm pack && npm publish ./*.tgz --access public --provenance )
            echo "::endgroup::"
          done
